<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kagger AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
    </style>
</head>

<body class="gradient-bg min-h-screen text-white">
    <!-- Navigation -->
    <nav class="bg-slate-900/50 backdrop-blur-sm border-b border-slate-700">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-6">
                    <a href="/app" class="flex items-center space-x-2">
                        <div
                            class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <span class="text-sm font-bold">K</span>
                        </div>
                        <span class="text-lg font-semibold">Kagger AI</span>
                    </a>
                    <span class="text-slate-500">|</span>
                    <span class="text-slate-300 font-medium">Admin Panel</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/app" class="text-slate-400 hover:text-white transition-colors">← Back to App</a>
                    <button onclick="logout()" class="text-red-400 hover:text-red-300 transition-colors">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
        <!-- Invite User Section -->
        <div class="bg-slate-800/50 backdrop-blur-sm rounded-2xl p-6 border border-slate-700 mb-8">
            <h2 class="text-xl font-bold mb-4">Invite New User</h2>

            <form id="invite-form" class="flex gap-4">
                <input type="email" id="invite-email" placeholder="user@example.com" required
                    class="flex-1 px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" id="invite-btn"
                    class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-lg font-semibold transition-all flex items-center space-x-2">
                    <span>Send Invite</span>
                </button>
            </form>

            <!-- Invite Result -->
            <div id="invite-result" class="hidden mt-4 p-4 rounded-lg"></div>
        </div>

        <!-- Users List -->
        <div class="bg-slate-800/50 backdrop-blur-sm rounded-2xl p-6 border border-slate-700">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold">All Users</h2>
                <button onclick="loadUsers()" class="text-slate-400 hover:text-white transition-colors text-sm">
                    ↻ Refresh
                </button>
            </div>

            <div id="users-loading" class="text-center py-8 text-slate-400">
                Loading users...
            </div>

            <div id="users-table" class="hidden overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-left text-slate-400 text-sm border-b border-slate-700">
                            <th class="pb-3 font-medium">Email</th>
                            <th class="pb-3 font-medium">Role</th>
                            <th class="pb-3 font-medium">Status</th>
                            <th class="pb-3 font-medium">Created</th>
                            <th class="pb-3 font-medium">Last Login</th>
                            <th class="pb-3 font-medium">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-body" class="text-sm">
                        <!-- Users will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Load users on page load
        document.addEventListener('DOMContentLoaded', loadUsers);

        async function loadUsers() {
            const loading = document.getElementById('users-loading');
            const table = document.getElementById('users-table');
            const tbody = document.getElementById('users-body');

            loading.classList.remove('hidden');
            table.classList.add('hidden');

            try {
                const response = await fetch('/api/admin/users');

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                if (response.status === 403) {
                    alert('Admin access required');
                    window.location.href = '/app';
                    return;
                }

                const data = await response.json();

                tbody.innerHTML = data.users.map(user => `
                    <tr class="border-b border-slate-700/50 hover:bg-slate-700/20">
                        <td class="py-4 pr-4">${user.email}</td>
                        <td class="py-4 pr-4">
                            <span class="px-2 py-1 rounded text-xs font-medium ${user.role === 'admin' ? 'bg-purple-500/20 text-purple-400' : 'bg-slate-500/20 text-slate-400'}">
                                ${user.role}
                            </span>
                        </td>
                        <td class="py-4 pr-4">
                            <span class="px-2 py-1 rounded text-xs font-medium ${user.is_active ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">
                                ${user.is_active ? 'Active' : 'Pending'}
                            </span>
                        </td>
                        <td class="py-4 pr-4 text-slate-400">${formatDate(user.created_at)}</td>
                        <td class="py-4 pr-4 text-slate-400">${user.last_login ? formatDate(user.last_login) : 'Never'}</td>
                        <td class="py-4">
                            ${user.role !== 'admin' ? `
                                <button onclick="deleteUser(${user.id}, '${user.email}')" class="text-red-400 hover:text-red-300 text-sm">
                                    Delete
                                </button>
                            ` : '<span class="text-slate-500 text-sm">-</span>'}
                        </td>
                    </tr>
                `).join('');

                loading.classList.add('hidden');
                table.classList.remove('hidden');

            } catch (error) {
                loading.textContent = 'Failed to load users';
            }
        }

        function formatDate(dateStr) {
            if (!dateStr || dateStr === 'None') return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            });
        }

        // Invite form
        document.getElementById('invite-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('invite-email').value;
            const btn = document.getElementById('invite-btn');
            const result = document.getElementById('invite-result');

            btn.disabled = true;
            btn.innerHTML = '<span>Sending...</span>';
            result.classList.add('hidden');

            try {
                const response = await fetch('/api/admin/invite', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    result.className = 'mt-4 p-4 rounded-lg bg-green-500/20 border border-green-500/50 text-green-400';
                    result.innerHTML = `
                        <p class="font-medium">✓ Invite sent to ${data.email}</p>
                        ${!data.email_sent ? `<p class="text-sm mt-2">Email delivery failed. Share this link manually:<br><code class="text-xs bg-slate-900 px-2 py-1 rounded mt-1 inline-block">${data.invite_url}</code></p>` : ''}
                    `;
                    document.getElementById('invite-email').value = '';
                    loadUsers(); // Refresh user list
                } else {
                    result.className = 'mt-4 p-4 rounded-lg bg-red-500/20 border border-red-500/50 text-red-400';
                    result.textContent = data.error || 'Failed to send invite';
                }
                result.classList.remove('hidden');

            } catch (error) {
                result.className = 'mt-4 p-4 rounded-lg bg-red-500/20 border border-red-500/50 text-red-400';
                result.textContent = 'Network error';
                result.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Send Invite</span>';
            }
        });

        async function deleteUser(userId, email) {
            if (!confirm(`Delete user ${email}?`)) return;

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadUsers();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to delete user');
                }
            } catch (error) {
                alert('Network error');
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }
    </script>
</body>

</html>
