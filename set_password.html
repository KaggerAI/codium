<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - Kagger AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
    </style>
  <script src="scale_ui.js"></script>
</head>

<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center space-x-2">
                <div
                    class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <span class="text-2xl font-bold text-white">K</span>
                </div>
                <span class="text-2xl font-bold text-white">Kagger AI</span>
            </div>
        </div>

        <!-- Set Password Card -->
        <div class="bg-slate-800/50 backdrop-blur-sm rounded-2xl p-8 border border-slate-700 shadow-2xl">
            <h1 class="text-2xl font-bold text-white mb-2 text-center">Set Your Password</h1>
            <p class="text-slate-400 text-center mb-8">Create a secure password to activate your account</p>

            <!-- Error Message -->
            <div id="error-message"
                class="hidden bg-red-500/20 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-6">
                <span id="error-text"></span>
            </div>

            <!-- Success Message -->
            <div id="success-message"
                class="hidden bg-green-500/20 border border-green-500/50 text-green-400 px-4 py-3 rounded-lg mb-6">
                <span id="success-text"></span>
            </div>

            <!-- Form -->
            <form id="password-form" class="space-y-6">
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">New Password</label>
                    <input type="password" id="password" name="password" required minlength="8"
                        class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="Minimum 8 characters">
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-slate-300 mb-2">Confirm
                        Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required minlength="8"
                        class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        placeholder="Re-enter your password">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 shadow-lg hover:shadow-xl flex items-center justify-center">
                    <span id="btn-text">Activate Account</span>
                    <svg id="btn-spinner" class="hidden animate-spin ml-2 h-5 w-5" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </form>

            <!-- Login Link (shown after success) -->
            <div id="login-link" class="hidden text-center mt-6">
                <a href="/login"
                    class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg transition-all">
                    Go to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        // Get token from URL
        const pathParts = window.location.pathname.split('/');
        const token = pathParts[pathParts.length - 1];

        if (!token || token === 'set-password') {
            document.getElementById('error-text').textContent = 'Invalid invite link. Please contact admin for a new invite.';
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('password-form').style.display = 'none';
        }

        const form = document.getElementById('password-form');
        const errorDiv = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const successDiv = document.getElementById('success-message');
        const successText = document.getElementById('success-text');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const submitBtn = document.getElementById('submit-btn');
        const loginLink = document.getElementById('login-link');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                errorText.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                errorText.textContent = 'Password must be at least 8 characters';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Hide error, show loading
            errorDiv.classList.add('hidden');
            btnText.textContent = 'Activating...';
            btnSpinner.classList.remove('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Show success
                    successText.textContent = 'Account activated! You can now login.';
                    successDiv.classList.remove('hidden');
                    form.style.display = 'none';
                    loginLink.classList.remove('hidden');
                } else {
                    // Show error
                    errorText.textContent = data.error || 'Failed to set password';
                    errorDiv.classList.remove('hidden');
                    btnText.textContent = 'Activate Account';
                    btnSpinner.classList.add('hidden');
                    submitBtn.disabled = false;
                }
            } catch (error) {
                errorText.textContent = 'Network error. Please try again.';
                errorDiv.classList.remove('hidden');
                btnText.textContent = 'Activate Account';
                btnSpinner.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
