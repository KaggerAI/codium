<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>AI-Enhanced News | Kagger</title>
    <script src="/kagger_theme.js"></script>
    <link rel="stylesheet" href="/kagger_theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-container {
            height: calc(100vh - 180px);
            overflow-y: auto;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .user-message {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            background: rgba(255, 255, 255, 0.03);
        }

        .ai-message th,
        .ai-message td {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px;
            text-align: left;
            color: rgba(255, 255, 255, 0.9);
        }

        .ai-message th {
            background: rgba(59, 130, 246, 0.15);
            font-weight: 600;
            color: #60a5fa;
        }

        .ai-message tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .ai-message ul,
        .ai-message ol {
            margin: 12px 0;
            padding-left: 28px;
            line-height: 1.8;
        }

        .ai-message ul {
            list-style-type: disc;
        }

        .ai-message ol {
            list-style-type: decimal;
        }

        .ai-message li {
            margin: 8px 0;
            color: rgba(255, 255, 255, 0.9);
        }

        .ai-message li::marker {
            color: #60a5fa;
            font-weight: 600;
        }

        .ai-message ul ul,
        .ai-message ol ul,
        .ai-message ul ol,
        .ai-message ol ol {
            margin: 4px 0;
            padding-left: 24px;
        }

        .ai-message strong {
            color: #60a5fa;
            font-weight: 600;
        }

        .ai-message em {
            color: #a78bfa;
            font-style: italic;
        }

        .ai-message p {
            margin: 10px 0;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.9);
        }

        .ai-message h1,
        .ai-message h2,
        .ai-message h3 {
            color: #93c5fd;
            margin: 20px 0 10px 0;
            font-weight: 600;
        }

        .ai-message h1 {
            font-size: 1.5em;
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
            padding-bottom: 8px;
        }

        .ai-message h2 {
            font-size: 1.3em;
        }

        .ai-message h3 {
            font-size: 1.1em;
        }

        .ai-message code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #f472b6;
            font-size: 0.9em;
        }

        .ai-message pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ai-message pre code {
            background: none;
            padding: 0;
            color: #e5e7eb;
        }

        .ai-message blockquote {
            border-left: 3px solid #60a5fa;
            padding-left: 16px;
            margin: 12px 0;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
        }

        .ai-message hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin: 20px 0;
        }

        .ai-message a {
            color: #60a5fa;
            text-decoration: underline;
        }

        .ai-message a:hover {
            color: #93c5fd;
        }

        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .pulse-animation {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .typing-indicator span {
            animation: blink 1.4s infinite both;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== Theme: light overrides (page is designed dark; see kagger_theme.css) ===== */
        html[data-theme="light"] body.kg-native-dark {
            background: var(--kg-bg);
        }

        html[data-theme="light"] .kg-native-dark .glass-card {
            background: var(--kg-surface);
            border-color: var(--kg-border);
            box-shadow: var(--kg-shadow);
        }

        html[data-theme="light"] .kg-native-dark .nw-header {
            background: rgb(255 255 255 / .92);
            border-width: 0 0 1px;
        }

        html[data-theme="light"] .kg-native-dark .nw-logo {
            background-image: var(--kg-gradient);
        }

        html[data-theme="light"] .kg-native-dark .nw-back {
            border: 1px solid var(--kg-border);
        }

        html[data-theme="light"] .chat-container::-webkit-scrollbar-track {
            background: rgb(15 23 42 / .04);
        }

        html[data-theme="light"] .chat-container::-webkit-scrollbar-thumb {
            background: rgb(15 23 42 / .18);
        }

        html[data-theme="light"] .kg-native-dark .nw-welcome-icon {
            background-image: none;
            background-color: var(--kg-primary-soft);
        }

        html[data-theme="light"] .kg-native-dark .nw-welcome-icon svg {
            color: var(--kg-primary);
        }

        html[data-theme="light"] .kg-native-dark .nw-chip {
            background-color: var(--kg-surface);
        }

        html[data-theme="light"] .kg-native-dark .nw-chip:hover {
            background-color: var(--kg-primary-tint);
            border-color: #86efac;
            color: var(--kg-primary-strong);
        }

        html[data-theme="light"] .kg-native-dark #questionInput {
            background-color: var(--kg-input-bg);
            border-color: var(--kg-input-border);
        }

        html[data-theme="light"] .kg-native-dark #questionInput:focus {
            border-color: var(--kg-primary);
            box-shadow: 0 0 0 3px var(--kg-focus);
        }

        html[data-theme="light"] .kg-native-dark .typing-indicator span {
            background-color: var(--kg-primary);
        }

        html[data-theme="light"] .kg-native-dark .user-message {
            background: var(--kg-gradient);
            color: #fff;
        }

        html[data-theme="light"] .kg-native-dark .ai-message {
            background: var(--kg-surface);
            border-color: var(--kg-border);
            box-shadow: var(--kg-shadow);
            color: var(--kg-text);
        }

        html[data-theme="light"] .kg-native-dark .ai-message table {
            background: var(--kg-surface);
        }

        html[data-theme="light"] .kg-native-dark .ai-message :is(th, td) {
            border-color: var(--kg-border-strong);
            color: var(--kg-text);
        }

        html[data-theme="light"] .kg-native-dark .ai-message th {
            background: var(--kg-primary-tint);
            color: var(--kg-primary-strong);
        }

        html[data-theme="light"] .kg-native-dark .ai-message tbody tr:hover {
            background: var(--kg-subtle);
        }

        html[data-theme="light"] .kg-native-dark .ai-message :is(p, li) {
            color: var(--kg-text);
        }

        html[data-theme="light"] .kg-native-dark .ai-message li::marker {
            color: var(--kg-primary);
        }

        html[data-theme="light"] .kg-native-dark .ai-message strong {
            color: var(--kg-text-strong);
        }

        html[data-theme="light"] .kg-native-dark .ai-message em {
            color: #6d28d9;
        }

        html[data-theme="light"] .kg-native-dark .ai-message :is(h1, h2, h3) {
            color: var(--kg-primary-strong);
        }

        html[data-theme="light"] .kg-native-dark .ai-message h1 {
            border-bottom-color: rgb(22 163 74 / .3);
        }

        html[data-theme="light"] .kg-native-dark .ai-message code {
            background: var(--kg-inset);
            color: #be185d;
        }

        html[data-theme="light"] .kg-native-dark .ai-message pre {
            background: var(--kg-subtle);
            border-color: var(--kg-border);
        }

        html[data-theme="light"] .kg-native-dark .ai-message pre code {
            background: none;
            color: var(--kg-text);
        }

        html[data-theme="light"] .kg-native-dark .ai-message blockquote {
            border-left-color: var(--kg-primary);
            color: var(--kg-text-3);
        }

        html[data-theme="light"] .kg-native-dark .ai-message hr {
            border-top-color: var(--kg-border);
        }

        html[data-theme="light"] .kg-native-dark .ai-message a {
            color: var(--kg-link);
        }

        html[data-theme="light"] .kg-native-dark .ai-message a:hover {
            color: var(--kg-primary-strong);
        }

        /* ===== Responsive (desktop >= 1280px unchanged) ===== */
        /* Laptops zoomed in / tablets: header + chat + input bar fit the screen exactly. */
        @media (max-width: 1279px) {
            #chatContainer {
                height: calc(100vh - 224px);
                height: calc(100dvh - 224px);
                min-height: 12rem;
            }
        }

        @media (max-width: 640px) {
            body .nw-header-inner {
                padding: .625rem .75rem;
                gap: .5rem;
            }

            body .nw-brand {
                gap: .5rem;
                min-width: 0;
            }

            .nw-brand > div:last-child {
                min-width: 0;
            }

            body .nw-logo {
                flex: none;
                width: 2rem;
                height: 2rem;
                border-radius: .625rem;
            }

            .nw-logo svg {
                width: 1.25rem;
                height: 1.25rem;
            }

            body .nw-title {
                font-size: 1rem;
                line-height: 1.375rem;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .nw-title-pre,
            .nw-sub,
            .nw-back-label {
                display: none;
            }

            .nw-actions {
                flex: none;
            }

            /* "Back to App" becomes a square arrow button (label kept as aria-label). */
            body .nw-back {
                width: 2.25rem;
                height: 2.25rem;
                padding: 0;
                justify-content: center;
            }

            body .nw-main {
                padding: 4.25rem .75rem .75rem;
            }

            /* 166px = header + gaps + input bar; dvh follows the browser toolbars and,
               with interactive-widget=resizes-content, the on-screen keyboard. */
            #chatContainer {
                height: calc(100vh - 166px);
                height: calc(100dvh - 166px);
                min-height: 10rem;
                padding: 1rem;
                margin-bottom: .75rem;
            }

            #welcomeMessage {
                padding-top: 2rem;
                padding-bottom: 2rem;
            }

            body .nw-input-card {
                padding: .75rem;
            }

            #chatForm {
                gap: .5rem;
            }

            #questionInput {
                min-width: 0;
                padding: .75rem 1rem;
            }

            #sendButton {
                flex: none;
                padding: .75rem 1rem;
            }

            #sendButton > span {
                display: none;
            }

            #chatMessages > div > div {
                max-width: 92%;
                min-width: 0;
                overflow-wrap: anywhere;
                padding: .75rem 1rem;
            }

            .ai-message table {
                display: block;
                max-width: 100%;
                overflow-x: auto;
            }

            .ai-message th,
            .ai-message td {
                min-width: 5rem;
                padding: 8px 10px;
                overflow-wrap: normal;
            }

            /* The last column is usually the descriptive one: keep it readable while the table scrolls. */
            .ai-message :is(th, td):last-child:not(:first-child) {
                min-width: 11rem;
            }

            .ai-message ul,
            .ai-message ol {
                padding-left: 1.25rem;
            }
        }

        @media (max-width: 400px) {
            body .nw-title {
                font-size: .9375rem;
            }
        }
    </style>
  <script src="/scale_ui.js"></script>
</head>

<body class="kg-native-dark text-white">
    <!-- Header -->
    <header class="nw-header fixed top-0 left-0 right-0 z-50 glass-card">
        <div class="nw-header-inner max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="nw-brand flex items-center gap-3">
                <div
                    class="nw-logo w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h1 class="nw-title kg-brand-text text-xl font-bold gradient-text"><span class="nw-title-pre">Kagger's </span>AI-Enhanced News Search</h1>
                    <p class="nw-sub text-xs text-slate-400">India's Most Advanced Financial Research Engine</p>
                </div>
            </div>
            <div class="nw-actions flex items-center gap-2">
            <button class="kg-theme-toggle text-slate-300" data-kg-theme-toggle></button>
            <a href="/" aria-label="Back to App"
                class="nw-back px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition-all text-sm font-medium flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span class="nw-back-label"><span class="nw-back-long">Back to </span>App</span>
            </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="nw-main pt-24 pb-6 px-4">
        <div class="max-w-4xl mx-auto">
            <!-- Chat Container -->
            <div id="chatContainer" class="chat-container rounded-2xl glass-card p-6 mb-4">
                <!-- Welcome Message -->
                <div id="welcomeMessage" class="text-center py-16">
                    <div
                        class="nw-welcome-icon w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-blue-500/20 to-purple-600/20 flex items-center justify-center">
                        <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold mb-3">Ask Anything About Markets</h2>
                    <p class="text-slate-400 max-w-md mx-auto mb-8">
                        Ask about stocks, sectors, market news, or any financial topic.
                        I'll understand your intent and provide comprehensive insights.
                    </p>
                    <div class="flex flex-wrap justify-center gap-3">
                        <button onclick="askSuggestion('What happened in the market today?')"
                            class="nw-chip px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-sm transition-all">
                            What happened in the market today?
                        </button>
                        <button onclick="askSuggestion('RELIANCE news')"
                            class="nw-chip px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-sm transition-all">
                            RELIANCE news
                        </button>
                        <button onclick="askSuggestion('IT sector outlook')"
                            class="nw-chip px-4 py-2 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-sm transition-all">
                            IT sector outlook
                        </button>
                    </div>
                </div>

                <!-- Chat Messages will be inserted here -->
                <div id="chatMessages" class="space-y-4 hidden"></div>
            </div>

            <!-- Input Area -->
            <div class="nw-input-card glass-card rounded-2xl p-4">
                <form id="chatForm" class="flex gap-3">
                    <input type="text" id="questionInput" placeholder="Ask about stocks, sectors, market news..."
                        class="flex-1 bg-white/5 border border-white/10 rounded-xl px-5 py-4 text-white placeholder-slate-500 focus:outline-none input-glow transition-all"
                        autocomplete="off">
                    <button type="submit" id="sendButton" aria-label="Send"
                        class="kg-brand-btn px-6 py-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl font-semibold hover:opacity-90 transition-all flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span>Send</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Conversation history
        let conversationHistory = [];
        let isLoading = false;

        // DOM Elements
        const chatContainer = document.getElementById('chatContainer');
        const chatMessages = document.getElementById('chatMessages');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const questionInput = document.getElementById('questionInput');
        const sendButton = document.getElementById('sendButton');
        const chatForm = document.getElementById('chatForm');

        // Configure marked for markdown rendering
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        function askSuggestion(question) {
            questionInput.value = question;
            chatForm.dispatchEvent(new Event('submit'));
        }

        function addMessage(role, content) {
            // Hide welcome message on first message
            welcomeMessage.classList.add('hidden');
            chatMessages.classList.remove('hidden');

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            const bubbleClass = role === 'user' ? 'user-message' : 'ai-message';
            const maxWidth = role === 'user' ? 'max-w-md' : 'max-w-3xl';

            let renderedContent = content;
            if (role === 'assistant') {
                // Debug: log raw content before parsing
                console.log('DEBUG: Raw markdown content:', content.substring(0, 500));

                // Render markdown for AI responses
                renderedContent = marked.parse(content);

                // Debug: log rendered HTML
                console.log('DEBUG: Rendered HTML:', renderedContent.substring(0, 500));
            }

            messageDiv.innerHTML = `
                <div class="${bubbleClass} ${maxWidth} rounded-2xl px-5 py-4 text-sm leading-relaxed">
                    ${role === 'user' ? content : renderedContent}
                </div>
            `;

            chatMessages.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.className = 'flex justify-start';
            loadingDiv.innerHTML = `
                <div class="ai-message rounded-2xl px-5 py-4">
                    <div class="flex items-center gap-3">
                        <div class="typing-indicator flex gap-1">
                            <span class="w-2 h-2 bg-blue-400 rounded-full"></span>
                            <span class="w-2 h-2 bg-blue-400 rounded-full"></span>
                            <span class="w-2 h-2 bg-blue-400 rounded-full"></span>
                        </div>
                        <span class="text-slate-400 text-sm">Researching...</span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loader = document.getElementById('loadingIndicator');
            if (loader) loader.remove();
        }

        async function sendMessage(question) {
            if (isLoading || !question.trim()) return;

            isLoading = true;
            sendButton.disabled = true;
            questionInput.value = '';

            // Add user message to UI
            addMessage('user', question);

            // Add to conversation history
            conversationHistory.push({ role: 'user', content: question });

            // Show loading
            addLoadingIndicator();

            try {
                const response = await fetch('/ai-news', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        conversation_history: conversationHistory
                    })
                });

                const data = await response.json();
                removeLoadingIndicator();

                if (data.status === 'success' && data.answer) {
                    // Add AI response to UI
                    addMessage('assistant', data.answer);

                    // Add to conversation history
                    conversationHistory.push({ role: 'assistant', content: data.answer });
                } else {
                    addMessage('assistant', 'Sorry, I encountered an error while researching. Please try again.');
                }

            } catch (error) {
                console.error('Error:', error);
                removeLoadingIndicator();
                addMessage('assistant', 'Sorry, something went wrong. Please try again.');
            } finally {
                isLoading = false;
                sendButton.disabled = false;
                questionInput.focus();
            }
        }

        // Form submission
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage(questionInput.value);
        });

        // Focus input on load
        questionInput.focus();
    </script>
</body>

</html>
